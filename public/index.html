<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Główna Strona Hotelu</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
<!-- Czcionka użyta w headerze -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
</head>
<body>
    
<header class="header">

    <div class="logo">
        <img src="../assets/logo.png" alt="Logo">
    </div>
    <nav class="nav">
            <a href="#">O Nas</a>
            <a href="#">Pokoje</a>
            <a href="#">Kontakt</a>
            <a href="#">Login</a>
    </nav>
</header>

<section class="rezerwacja">
  <div class="pola">
    <div class="pole">
      <label for="check-in">Zameldowanie:</label>
      <input type="date" id="check-in">
    </div>

    <div class="pole">
      <label for="check-out">Wymeldowanie:</label>
      <input type="date" id="check-out">
    </div>

    <div class="pole">
      <label for="goście">Goście:</label>
      <input type="number" id="goście" min="1" max="10" value="1">
    </div>
  </div>

</section>

    </div>
  </div>
</section>

<footer class="footer">
    <p>&copy; 2026 Hotel. Wszelkie prawa zastrzeżone.</p>
</footer>


</body>
</html>
