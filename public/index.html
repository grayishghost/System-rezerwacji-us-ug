<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Główna Strona Spa</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
<!-- Czcionka użyta w headerze -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
</head>
<body>
    
<header class="header">

    <div class="logo">
        <img src="../assets/logo.png" alt="Logo">
    </div>
    <nav class="nav">
            <a href="#">O Nas</a>
            <a href="#">Pokoje</a>
            <a href="#">Kontakt</a>
            <a href="#">Login</a>
    </nav>
</header>

<section class="rezerwacja">
  <div class="pola">
    <div class="pole">
      <label for="id_pokoju">Wybrany pokój:</label>
      <select id="id_pokoju" name="id_pokoju">
        <option value="">-- Wybierz pokój --</option>
        <option value="1">Pokój 101 - Standard 1 osoba (200.00 zł/doba)</option>
        <option value="2">Pokój 102 - Apartament deluxe (500.00 zł/doba)</option>
      </select>
    </div>

    <div class="pole">
      <label for="data_od">Data zameldowania (DataOd):</label>
      <input type="date" id="data_od" name="data_od">
    </div>

    <div class="pole">
      <label for="data_do">Data wymeldowania (DataDo):</label>
      <input type="date" id="data_do" name="data_do">
    </div>

    <div class="pole">
      <label for="ilosc_osob">Liczba osób:</label>
      <input type="number" id="ilosc_osob" name="ilosc_osob" min="1" max="10" value="1">
    </div>
  </div>

</section>

    </div>
  </div>
</section>

<footer class="footer">
    <p>&copy; 2026 Spa. Wszelkie prawa zastrzeżone.</p>
</footer>

</body>
</html>
